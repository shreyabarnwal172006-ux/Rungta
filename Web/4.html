<!DOCTYPE html>
<html>
      <!-- create a html page to style a main heading in a center alignment
        with blue color and aqua backround ,
        paragraph should be start from right sidenof the page in a different 
        font family from heading in green color of text-->
    <head>
        <title>page </title>
        <style>
            h1{
                text-align: center;
                font-size: 80px;
                color: blue;
                background-color: aqua;
                font-family:'Times New Roman', Times, serif;
                
            }
            p{
                text-align: right;
                font-size: 20px;
                font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
                color: green;
                
            }

            
        </style>
    </head>
    <body>
        <h1>No Exclamation at the End:</h1>
        <p> Notice that there is an exclamation mark (!) in the opening tag, but not in the closing tag.</p>
    </body>
</html>
